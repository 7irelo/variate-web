name: assistant-service

on:
  push:
    branches: [main]
    paths: ["platform/src/AssistantService/**", ".github/workflows/assistant-service.yml"]
  pull_request:
    paths: ["platform/src/AssistantService/**", ".github/workflows/assistant-service.yml"]

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform/src/AssistantService

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/src/AssistantService/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Train distilled router
        run: python -m distill.train --labels gold
      # Offline variants always run. Provider-backed variants (LLM router,
      # rerank, answer judge) run only when the repository has the API key
      # secrets; forks and PRs from forks never receive them.
      - name: Eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evals.run all --gate --out eval-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: platform/src/AssistantService/eval-reports

  image:
    runs-on: ubuntu-latest
    needs: test-and-eval
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t assistant-service:ci .
